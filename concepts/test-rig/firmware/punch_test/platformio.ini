; PlatformIO project for punch_test.ino. The Arduino IDE can still open the .ino directly.
; Build with the env that matches your board (the module's label says which):
;   esp32dev  boards with an ESP32-WROOM-32 module, the usual dev boards
;   esp32-s3  ESP32-S3 boards; plug into the USB port marked UART or COM
[platformio]
src_dir = .
default_envs = esp32dev

[env]
; pioarduino: the community fork that tracks Espressif's current Arduino core (3.x).
; PlatformIO's own "espressif32" platform still ships Arduino core 2.0.17.
; To move to a newer release, change the version in this URL:
; https://github.com/pioarduino/platform-espressif32/releases
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
build_src_filter = +<*> -<.pio/> -<.vscode/>
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

[env:esp32dev]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1
