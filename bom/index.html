<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill of Materials</title>
<meta name="description" content="Parts and costs for the Punch Point braille embosser.">
<style>
:root {
  --bg: #ffffff;
  --ink: #1b1f24;
  --muted: #59636e;
  --rule: #d6dbe0;
  --head: #f1f3f5;
  --link: #1f5f8b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --ink: #e3e7eb; --muted: #9aa5b0; --rule: #2c343c; --head: #1a2027; --link: #8cc0e3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --ink: #e3e7eb; --muted: #9aa5b0; --rule: #2c343c; --head: #1a2027; --link: #8cc0e3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-size: 1.8rem; margin: 0 0 8px; }
p { margin: 0 0 16px; max-width: 70ch; }
a { color: var(--link); }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--rule); }
thead th { background: var(--head); font-weight: 600; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.est { display: block; color: var(--muted); font-size: .8rem; }
tfoot th, tfoot td { font-weight: 600; border-bottom: none; }
.note { color: var(--muted); font-size: .9rem; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Bill of materials</h1>
  <p>Quantities are for the two designs: one stylus or six styli. Prices are in US dollars. A price without a store link is an estimate.</p>
  <div class="wrap">
    <table>
      <thead>
        <tr><th scope="col">Part</th><th scope="col">Details</th><th scope="col" class="num">Unit cost</th><th scope="col" class="num">One stylus</th><th scope="col" class="num">Six styli</th></tr>
      </thead>
      <tbody id="rows"></tbody>
      <tfoot>
        <tr><th scope="row" colspan="3">Total</th><td class="num" id="totalOne"></td><td class="num" id="totalSix"></td></tr>
      </tfoot>
    </table>
  </div>
  <p class="note" id="note">Loading the parts list.</p>
</main>
<script>
(function () {
  const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

  function parseCSV(text) {
    const rows = []; let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (quoted) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') quoted = false;
        else field += c;
      } else if (c === '"') quoted = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.some((f) => f !== '')) rows.push(row);
        row = [];
      } else field += c;
    }
    row.push(field);
    if (row.some((f) => f !== '')) rows.push(row);
    const head = rows.shift();
    return rows.map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
  }

  function cell(tag, text, cls) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  fetch('parts.csv', { cache: 'no-cache' })
    .then((res) => { if (!res.ok) throw new Error(res.status); return res.text(); })
    .then((text) => {
      const parts = parseCSV(text);
      let one = 0, six = 0;
      const body = document.getElementById('rows');
      for (const p of parts) {
        const unit = Number(p.unit_cost), q1 = Number(p.qty_one_stylus), q6 = Number(p.qty_six_styli);
        one += unit * q1; six += unit * q6;
        const tr = document.createElement('tr');
        const name = cell('th');
        name.scope = 'row';
        name.style.fontWeight = 'normal';
        if (p.link) { const a = cell('a', p.part); a.href = p.link; name.append(a); } else name.textContent = p.part;
        const price = cell('td', money.format(unit), 'num');
        if (!p.link) price.append(cell('span', 'estimate', 'est'));
        tr.append(name, cell('td', p.details), price, cell('td', q1 ? String(q1) : '', 'num'), cell('td', q6 ? String(q6) : '', 'num'));
        body.append(tr);
      }
      document.getElementById('totalOne').textContent = money.format(one);
      document.getElementById('totalSix').textContent = money.format(six);
      const latest = parts.map((p) => p.checked).filter(Boolean).sort().pop();
      const when = latest ? new Date(latest + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '';
      document.getElementById('note').textContent = when ? `Prices checked ${when}.` : '';
    })
    .catch(() => {
      document.getElementById('note').innerHTML = 'The parts list did not load. It is in <a href="https://github.com/b-47/punch-point/blob/main/bom/parts.csv">parts.csv</a>.';
    });
})();
</script>
</body>
</html>
